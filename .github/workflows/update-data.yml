name: Atualizar dados oficiais
on:
  schedule:
    - cron: "17 13 * * 1-5"   # dias úteis, 10h17 em Brasília
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node --test tests/*.test.js
      - run: python3 scripts/update_data.py
      - name: Commit se houver mudança
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/snapshot.json
          git diff --cached --quiet || git commit -m "Atualiza dados oficiais (BCB SGS)"
          git push
